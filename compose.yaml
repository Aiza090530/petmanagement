name: maypet
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: petmanagement
      MYSQL_USER: petmanagement
      MYSQL_PASSWORD: petmanagement_local
      MYSQL_ROOT_PASSWORD: root_local
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      mysql:
        condition: service_healthy
  nodejs:
    build: ./petmanagementNode
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      PORT: "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
  backend:
    build: ./petmanagementBack
    env_file: ./petmanagementBack/.env
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://localhost:5173
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: petmanagement
      DB_USERNAME: petmanagement
      DB_PASSWORD: petmanagement_local
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - backend-storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:5000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
  frontend:
    build: ./petmanagement
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  backend-storage:
  mysql-data:
